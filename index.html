<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社會課遊戲室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#e7eeec;--paper:#f9fbfa;--ink:#15262e;--muted:#5a6d70;--line:#c8d5d2;--accent:#1d5d70;--brass:#a8741a;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;--f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0e191d;--paper:#15242a;--ink:#e3ebe8;--muted:#90a4a4;--line:#2a3e44;--accent:#6db3c6;--brass:#d8a547;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:40px 64px;display:grid;gap:28px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
header h1{font-size:2.4rem;line-height:1.2}
header p{margin:6px 0 0;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
a.game{display:grid;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.game:hover,a.game:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.unit{font-size:.8rem;color:var(--brass);font-weight:700;letter-spacing:.06em}
a.game h2{font-size:1.45rem}
a.game p{margin:0;color:var(--muted);font-size:.95rem}
.go{color:var(--accent);font-weight:700;font-size:.92rem}
footer{color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){a.game{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>社會課遊戲室</h1>
    <p>課堂上用的遊戲和紀錄工具，點進去就能開始。</p>
  </header>
  <main class="list">
    <a class="game" href="sandbox.html">
      <span class="unit">五上｜臺灣登上國際舞臺</span>
      <h2>大航海時代・沙盤推演紀錄器</h2>
      <p>荷蘭、西班牙、漢人移民、原住民四組交換白銀、糧食、鹿皮、獵場卡和人心卡。紀錄每回合的交易，代幣用完時會出現該組的狀態畫面。</p>
      <span class="go">開始紀錄 →</span>
    </a>
  </main>
  <footer>紀錄會存在這台電腦的瀏覽器裡，請固定用同一台電腦開。</footer>
</div>
</body>
</html>
